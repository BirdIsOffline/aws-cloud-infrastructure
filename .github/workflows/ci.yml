name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  AWS_EC2_METADATA_DISABLED: "true"

jobs:
  source:
    name: Source and server automation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate source, contracts, and Bash
        run: bash scripts/ci/validate.sh

  terraform:
    name: Terraform formatting and validation
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install signature-verified Terraform 1.17.2
        run: python3 -B scripts/ci/install_terraform.py
      - name: Check Terraform formatting
        working-directory: terraform
        run: terraform fmt -check -recursive
      - name: Initialize locked providers without a backend
        working-directory: terraform
        run: terraform init -backend=false -input=false -lockfile=readonly
      - name: Validate Terraform configuration
        working-directory: terraform
        run: terraform validate
      - name: Verify CI-only deployment suspension with mocked AWS
        working-directory: terraform
        run: terraform test
