name: Restricted lab deployment executor

on:
  workflow_call:
    inputs:
      commit:
        required: true
        type: string
    secrets:
      CD_GITHUB_OWNER_ID:
        required: true
      CD_GITHUB_REPOSITORY_ID:
        required: true
      CD_ALLOWED_ACTOR_IDS:
        required: true
      CD_ROLE_ARN:
        required: true
      CD_ROLE_UNIQUE_ID:
        required: true
      CD_INSTANCE_ID:
        required: true
      CD_VPC_ID:
        required: true
      CD_SSM_DOCUMENT_SHA256:
        required: true

permissions: {}

jobs:
  execute:
    name: Authenticate and deploy one approved release
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      CD_COMMIT: ${{ inputs.commit }}
      AWS_REGION: us-east-2
      AWS_DEFAULT_REGION: us-east-2
      AWS_EC2_METADATA_DISABLED: "true"
      AWS_MAX_ATTEMPTS: "1"
      AWS_RETRY_MODE: standard
      AWS_PAGER: ""
    steps:
      - name: Check out immutable dispatch revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Recheck authorization and prepare pinned private bundle
        env:
          GH_TOKEN: ${{ github.token }}
          CD_GITHUB_OWNER_ID: ${{ secrets.CD_GITHUB_OWNER_ID }}
          CD_GITHUB_REPOSITORY_ID: ${{ secrets.CD_GITHUB_REPOSITORY_ID }}
          CD_ALLOWED_ACTOR_IDS: ${{ secrets.CD_ALLOWED_ACTOR_IDS }}
          CD_ROLE_ARN: ${{ secrets.CD_ROLE_ARN }}
          CD_ROLE_UNIQUE_ID: ${{ secrets.CD_ROLE_UNIQUE_ID }}
          CD_INSTANCE_ID: ${{ secrets.CD_INSTANCE_ID }}
          CD_VPC_ID: ${{ secrets.CD_VPC_ID }}
          CD_SSM_DOCUMENT_SHA256: ${{ secrets.CD_SSM_DOCUMENT_SHA256 }}
        run: python3 -B scripts/cd/delivery.py prepare
      - name: Assume restricted deployment role with OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-region: us-east-2
          audience: sts.amazonaws.com
          role-to-assume: ${{ secrets.CD_ROLE_ARN }}
          role-session-name: ${{ env.CD_SESSION_NAME }}
          role-duration-seconds: 1800
          allowed-account-ids: ${{ env.CD_ACCOUNT_ID }}
          mask-aws-account-id: true
          unset-current-credentials: true
          translate-env-variables: false
          output-credentials: false
          disable-retry: true
          action-timeout-s: 60
      - name: Verify target, submit once, and verify delivery
        env:
          GH_TOKEN: ${{ github.token }}
          CD_GITHUB_OWNER_ID: ${{ secrets.CD_GITHUB_OWNER_ID }}
          CD_GITHUB_REPOSITORY_ID: ${{ secrets.CD_GITHUB_REPOSITORY_ID }}
          CD_ALLOWED_ACTOR_IDS: ${{ secrets.CD_ALLOWED_ACTOR_IDS }}
          CD_ROLE_ARN: ${{ secrets.CD_ROLE_ARN }}
          CD_ROLE_UNIQUE_ID: ${{ secrets.CD_ROLE_UNIQUE_ID }}
          CD_INSTANCE_ID: ${{ secrets.CD_INSTANCE_ID }}
          CD_VPC_ID: ${{ secrets.CD_VPC_ID }}
          CD_SSM_DOCUMENT_SHA256: ${{ secrets.CD_SSM_DOCUMENT_SHA256 }}
        run: python3 -B scripts/cd/delivery.py deploy
